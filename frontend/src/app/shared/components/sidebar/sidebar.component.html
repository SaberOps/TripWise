<aside class="sidebar" aria-label="Primary navigation">
  <div class="menu-section">
    <p class="section-title">MAIN MENU</p>

    <nav class="menu-items" aria-label="Main menu">
      <a routerLink="/home" routerLinkActive="active" ariaCurrentWhenActive="page"
         [routerLinkActiveOptions]="{ exact: true }" class="menu-item" title="Dashboard">
        <span class="menu-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="4" rx="1.5"/><rect x="13.5" y="10.5" width="7" height="10" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/></svg>
        </span>
        <span class="menu-label">Dashboard</span>
      </a>

      <a routerLink="/destinations" routerLinkActive="active" ariaCurrentWhenActive="page"
         class="menu-item" title="Explore destinations">
        <span class="menu-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5"/><path d="m14.8 9.2-1.7 4-4 1.6 1.7-4 4-1.6Z"/></svg>
        </span>
        <span class="menu-label">Explore Destinations</span>
      </a>

      <a routerLink="/trips" routerLinkActive="active" ariaCurrentWhenActive="page"
         class="menu-item" title="My trips">
        <span class="menu-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="m3 13 7.2-1.7L17 4.5a2 2 0 0 1 2.8 2.8l-6.8 6.8L11.3 21l-2.1-5.1L3 13Z"/><path d="m7 17-3 3"/></svg>
        </span>
        <span class="menu-label">My Trips</span>
      </a>

      <a routerLink="/favorites" routerLinkActive="active" ariaCurrentWhenActive="page"
         class="menu-item" title="Favorites">
        <span class="menu-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M20.2 8.7c0 4.2-8.2 10-8.2 10s-8.2-5.8-8.2-10a4.3 4.3 0 0 1 8.2-1.8 4.3 4.3 0 0 1 8.2 1.8Z"/></svg>
        </span>
        <span class="menu-label">Favorites</span>
      </a>

      <a routerLink="/budget" routerLinkActive="active" ariaCurrentWhenActive="page"
         class="menu-item" title="Budget planner">
        <span class="menu-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5" width="17" height="14" rx="2"/><path d="M3.5 9h17M7.5 14h3"/></svg>
        </span>
        <span class="menu-label">Budget Planner</span>
      </a>
    </nav>
  </div>

  <div class="sidebar-bottom">
    <div class="travel-tip">
      <span class="tip-icon" aria-hidden="true">✦</span>
      <strong>Travel tip</strong>
      <p>Great journeys begin with a little planning.</p>
    </div>
  </div>
</aside>
